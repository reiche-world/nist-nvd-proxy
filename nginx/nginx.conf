user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  off;

    sendfile        on;
    keepalive_timeout  65;

    # NVD proxy cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nvd_cache:10m max_size=1g inactive=24h use_temp_path=off;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        location /feeds/ {
            proxy_pass https://nvd.nist.gov;
            proxy_set_header Host nvd.nist.gov;
            proxy_ssl_server_name on;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache nvd_cache;
            proxy_cache_valid 200 302 1d;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Ignore upstream caching headers (Set-Cookie, Cache-Control, Expires) so responses are cached
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}
